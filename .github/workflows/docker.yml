name: Build Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ghcr.io/khadriouiabdoerrak-max/frontend:latest
            ghcr.io/khadriouiabdoerrak-max/frontend:${{ github.sha }}
            ghcr.io/khadriouiabdoerrak-max/frontend:main
          build-args: |
            NEXT_PUBLIC_API_URL=http://187.124.46.250:8000
            NEXT_PUBLIC_META_PIXEL_ID=
            NEXT_PUBLIC_TIKTOK_PIXEL_ID=
            NEXT_PUBLIC_SNAPCHAT_PIXEL_ID=
            NEXT_PUBLIC_BUILD_ID=${{ github.sha }}
            CACHEBUST=${{ github.sha }}

      - name: Make container image public
        continue-on-error: true
        run: gh api --method POST /user/packages/container/frontend/visibility -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # EasyPanel VPS is not reachable from GitHub-hosted runners (curl exit 28).
      # Deploy is triggered from local deploy.ps1 after CI succeeds.
      - name: Remind EasyPanel deploy
        run: |
          echo "Image pushed to ghcr.io/khadriouiabdoerrak-max/frontend:latest"
          echo "Run frontend/deploy.ps1 locally (or EasyPanel Force Rebuild) to go live."
