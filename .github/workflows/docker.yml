name: Build Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/khadriouiabdoerrak-max/frontend:latest
            ghcr.io/khadriouiabdoerrak-max/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://187.124.46.250:8000
            NEXT_PUBLIC_META_PIXEL_ID=
            NEXT_PUBLIC_TIKTOK_PIXEL_ID=
            NEXT_PUBLIC_SNAPCHAT_PIXEL_ID=

      - name: Make container image public
        run: gh api --method POST /user/packages/container/frontend/visibility -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
